name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "review/**"]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, and Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Install Firestore test tooling
        run: bun add --no-save firebase @firebase/rules-unit-testing firebase-tools

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Test Firestore rules in emulator
        run: bunx firebase emulators:exec --only firestore "node --test tests/firestore.rules.test.mjs"

      - name: Smoke test Render staging health endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/review/security-hardening'
        env:
          STAGING_URL: https://sap-staging.onrender.com
        run: |
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$STAGING_URL/api/health")"
          printf '%s' "$response" | node -e 'const fs = require("node:fs"); const health = JSON.parse(fs.readFileSync(0, "utf8")); if (health.status !== "ok") { console.error("Unexpected health response:", health); process.exit(1); } console.log("Staging API health check passed:", health.status);'
