name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "review/**"]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, and Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Firestore test tooling
        run: bun add --no-save firebase @firebase/rules-unit-testing firebase-tools

      - name: Test Firestore rules in emulator
        run: bunx firebase emulators:exec --only firestore "bun test tests/firestore.rules.test.ts"
